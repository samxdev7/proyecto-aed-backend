spring:
  application:
    name: cnm-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate

logging:
  level:
    com.cnm.backend: INFO

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000
  cors:
    # "*" = cualquier origen (dev out-of-box); en producción: lista separada por comas.
    origins: ${CORS_ORIGINS:*}

server:
  port: ${PORT:8080}