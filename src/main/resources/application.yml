spring:
  application:
    name: cnm-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 30000
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 2
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: app
logging:
  level:
    com.cnm.backend: INFO

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000
  google:
    client-id: ${GOOGLE_CLIENT_ID:504660215527-0gml5batfg23p6llcku19ss38f0lm3pr.apps.googleusercontent.com}
  supabase:
    url: ${SUPABASE_URL:https://gnotslrwwptblfoofgsx.supabase.co}
    anon-key: ${SUPABASE_ANON_KEY:sb_publishable_R-yNJTs0N1M_Z1-taZQ1fg_R3m187W2}
  cors:
    # "*" = cualquier origen (dev out-of-box); en producción: lista separada por comas.
    origins: ${CORS_ORIGINS:*}

server:
  port: ${PORT:8080}