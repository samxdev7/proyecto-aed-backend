spring:
  application:
    name: cnm-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate

logging:
  level:
    com.cnm.backend: INFO

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000

server:
  port: ${PORT:8080}