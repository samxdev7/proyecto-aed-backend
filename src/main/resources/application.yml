spring:
  application:
    name: cnm-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 2
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: app
logging:
  level:
    com.cnm.backend: INFO

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000
  cors:
    # "*" = cualquier origen (dev out-of-box); en producción: lista separada por comas.
    origins: ${CORS_ORIGINS:*}

server:
  port: ${PORT:8080}